name: Bug report
description: Report a reproducible problem in repo-scaffold
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence of steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: State what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the plugin version, agent, operating system, and target repository stack.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification details
      description: Include relevant non-sensitive logs, screenshots, or a minimal reproduction.
    validations:
      required: false
  - type: checkboxes
    id: security
    attributes:
      label: Sensitive information
      options:
        - label: I removed tokens, credentials, private repository content, and vulnerability details.
          required: true
