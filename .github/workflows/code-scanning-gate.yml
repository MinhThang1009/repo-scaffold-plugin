name: Code scanning gate

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  security-events: read

concurrency:
  group: code-scanning-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  code_scanning_gate:
    name: code-scanning-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require an explicit disposition for every open alert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_REF: ${{ github.ref }}
          MERGE_GROUP_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == 'pull_request_target' ]]; then
            python scripts/check_code_scanning_alerts.py \
              --pull-request "$PR_NUMBER" \
              --base-sha "$PR_BASE_SHA" \
              --head-sha "$PR_HEAD_SHA" \
              --expected-codeql-category "/language:actions" \
              --expected-codeql-category "/language:python" \
              --attempts 120 \
              --delay-seconds 10
          elif [[ "$EVENT_NAME" == 'merge_group' ]]; then
            python scripts/check_code_scanning_alerts.py \
              --ref "$MERGE_GROUP_REF" \
              --sha "$MERGE_GROUP_SHA" \
              --expected-codeql-category "/language:actions" \
              --expected-codeql-category "/language:python" \
              --attempts 120 \
              --delay-seconds 10
          else
            echo "::error::Unsupported event for the code-scanning gate."
            exit 1
          fi
