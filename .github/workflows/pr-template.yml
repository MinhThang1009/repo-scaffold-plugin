name: Pull Request Template

on:
  pull_request_target:
    types: [opened, edited, ready_for_review, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-template-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: false

jobs:
  pr_template:
    name: pr-template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target uses the trusted base workflow. Never check out or
      # execute the pull request head in this job.
      - name: Check out the base template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate pull request body against its template
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          markdown_preflight_source = Path(
              "skills/repo-scaffold/scripts/markdown_body_preflight.py"
          )
          if not markdown_preflight_source.is_file():
              markdown_preflight_source = Path("scripts/markdown_body_preflight.py")
          if not markdown_preflight_source.is_file():
              raise SystemExit("Trusted Markdown body preflight source is missing.")
          sys.path.insert(0, str(markdown_preflight_source.parent))
          from markdown_body_preflight import (
              hard_wrapped_prose_lines,
              strip_html_comments,
              strip_utf8_bom,
              split_gfm_lines,
          )
          from pr_template_preflight import template_catalog

          event_name = os.environ.get("EVENT_NAME", "pull_request_target")
          if event_name == "merge_group":
              print("Pull request template requirements were checked before merge-queue admission.")
              raise SystemExit(0)
          if event_name != "pull_request_target":
              raise SystemExit(f"Unsupported event for the pull request template gate: {event_name!r}.")
          body = os.environ.get("PR_BODY", "")
          title = os.environ.get("PR_TITLE", "")
          is_draft = os.environ.get("PR_IS_DRAFT", "true").lower() == "true"
          with tempfile.NamedTemporaryFile(
              mode="w", encoding="utf-8", suffix=".md", delete=False
          ) as body_file:
              body_file.write(body)
          try:
              body_preflight = subprocess.run(
                  [
                      sys.executable,
                      "scripts/markdown_body_preflight.py",
                      "--body-file",
                      body_file.name,
                  ],
                  capture_output=True,
                  check=False,
                  text=True,
              )
              if body_preflight.returncode != 0:
                  raise SystemExit(body_preflight.stderr)
              if (
                  os.environ.get("PR_USER") == "dependabot[bot]"
                  and os.environ.get("PR_USER_TYPE") == "Bot"
              ):
                  print("Pull request template validation is explicitly exempt for Dependabot.")
                  raise SystemExit(0)
              if (
                  os.environ.get("PR_HEAD_REF", "").startswith("release-please--branches--")
                  and os.environ.get("PR_HEAD_REPOSITORY", "").casefold()
                  == os.environ.get("PR_REPOSITORY", "").casefold()
                  and (
                      os.environ.get("PR_USER_TYPE") == "Bot"
                      or os.environ.get("PR_USER", "").casefold()
                      == os.environ.get("PR_REPOSITORY_OWNER", "").casefold()
                  )
              ):
                  print("Pull request template validation is explicitly exempt for Release Please.")
                  raise SystemExit(0)
              preflight = subprocess.run(
                  [
                      sys.executable,
                      "scripts/pr_template_preflight.py",
                      "--title",
                      title,
                      "--body-file",
                      body_file.name,
                  ],
                  capture_output=True,
                  check=False,
                  text=True,
              )
          finally:
              Path(body_file.name).unlink(missing_ok=True)
          if preflight.returncode != 0:
              raise SystemExit(preflight.stderr)
          non_prose_line_numbers = set()
          hard_wrapped_prose_lines(
              body, non_prose_line_numbers=non_prose_line_numbers
          )
          heading_pattern = re.compile(r"^##[ \t]+(.+?)[ \t]*$", re.MULTILINE)
          checklist_pattern = re.compile(r"^- \[[ xX]\] (.+?)\s*$", re.MULTILINE)
          checked_checklist_pattern = re.compile(r"^- \[[xX]\] (.+?)\s*$", re.MULTILINE)
          title_type_pattern = re.compile(
              r"^(?P<type>feat|fix|docs)(?:\([^()\r\n]+\))?!?: "
          )
          required_template_by_title_type = {
              "feat": "feature",
              "fix": "bugfix",
              "docs": "documentation",
          }
          template_marker_pattern = re.compile(
              r"^<!-- repo-scaffold:pr-template=([a-z][a-z0-9-]*) -->[ \t]*$",
              re.MULTILINE,
          )
          required_checklist_pattern = re.compile(
              r"<!-- repo-scaffold:required-checklist:start -->\s*(.*?)\s*"
              r"<!-- repo-scaffold:required-checklist:end -->",
              re.DOTALL,
          )
          optional_checklist_pattern = re.compile(
              r"^##[ \t]+(?:If applicable|Khi phù hợp|Danh sách tùy chọn)[ \t]*$\s*"
              r"<!-- repo-scaffold:optional-checklist:start -->.*?"
              r"<!-- repo-scaffold:optional-checklist:end -->\s*",
              re.MULTILINE | re.DOTALL,
          )
          fenced_code_start_pattern = re.compile(r"^[ \t]{0,3}(`{3,}|~{3,})")
          fenced_code_end_pattern = re.compile(r"^[ \t]{0,3}(`{3,}|~{3,})[ \t]*$")
          template_comment_pattern = re.compile(
              r"^[ \t]*<!-- repo-scaffold:(?:pr-template=[a-z][a-z0-9-]*|"
              r"required-checklist:(?:start|end)|optional-checklist:(?:start|end)) -->[ \t]*$"
          )

          def visible_markdown(markdown):
              """Discard code, HTML blocks, and comments while retaining gate markers."""
              visible_lines = []
              comment_open = False
              fence_character = None
              fence_length = 0
              for line_number, line in enumerate(
                  split_gfm_lines(markdown), start=1
              ):
                  if line_number in non_prose_line_numbers:
                      visible_lines.append("")
                      continue
                  fence_start_match = fenced_code_start_pattern.match(line)
                  if fence_character is not None:
                      fence_match = fenced_code_end_pattern.match(line)
                      if (
                          fence_match is not None
                          and fence_match.group(1)[0] == fence_character
                          and len(fence_match.group(1)) >= fence_length
                      ):
                          fence_character = None
                          fence_length = 0
                      visible_lines.append("")
                      continue
                  if fence_start_match is not None:
                      fence_character = fence_start_match.group(1)[0]
                      fence_length = len(fence_start_match.group(1))
                      visible_lines.append("")
                      continue
                  if comment_open:
                      comment_end = line.find("-->")
                      if comment_end < 0:
                          visible_lines.append("")
                          continue
                      line = line[comment_end + 3 :]
                      comment_open = False
                  if template_comment_pattern.fullmatch(line):
                      visible_lines.append(line)
                      continue
                  if "<!--" in line:
                      line, comment_open, _html_tag_spans = strip_html_comments(
                          line, False
                      )
                  visible_lines.append(line)
              return "\n".join(visible_lines)

          template_paths = template_catalog(Path("."))

          trusted_templates = {}
          for template_id, template_path in template_paths.items():
              try:
                  template = strip_utf8_bom(template_path.read_text(encoding="utf-8"))
              except OSError as error:
                  raise SystemExit(
                      f"Could not read trusted pull request template {template_path}: {error}"
                  ) from error
              if template_marker_pattern.findall(template) != [template_id]:
                  raise SystemExit(
                      f"Trusted template {template_path} must contain exactly "
                      f"<!-- repo-scaffold:pr-template={template_id} -->."
                  )
              required_checklists = required_checklist_pattern.findall(template)
              if len(required_checklists) != 1:
                  raise SystemExit(
                      f"Trusted template {template_path} must contain exactly one "
                      "required checklist section."
                  )
              optional_sections = optional_checklist_pattern.findall(template)
              if len(optional_sections) != 1:
                  raise SystemExit(
                      f"Trusted template {template_path} must contain exactly one "
                      "optional checklist section."
                  )
              required_checklist_items = checklist_pattern.findall(required_checklists[0])
              if not required_checklist_items:
                  raise SystemExit(
                      f"Trusted template {template_path} must contain required checklist items."
                  )
              required_headings = heading_pattern.findall(
                  optional_checklist_pattern.sub("", template)
              )
              if not required_headings:
                  raise SystemExit(
                      f"Trusted template {template_path} must contain required headings."
                  )
              trusted_templates[template_id] = (
                  required_headings,
                  required_checklist_items,
              )

          visible_body = visible_markdown(body)
          selected_template_ids = template_marker_pattern.findall(visible_body)
          if len(selected_template_ids) != 1:
              raise SystemExit(
                  "Pull request body must select exactly one trusted template with "
                  "<!-- repo-scaffold:pr-template=<id> -->."
              )
          selected_template_id = selected_template_ids[0]
          if selected_template_id not in trusted_templates:
              raise SystemExit(
                  f"Pull request body selects unknown template {selected_template_id!r}."
              )

          title_type_match = title_type_pattern.match(title)
          if title_type_match is not None:
              title_type = title_type_match.group("type")
              required_template_id = required_template_by_title_type[title_type]
              if selected_template_id != required_template_id:
                  raise SystemExit(
                      f"Pull request title type {title_type!r} must use the "
                      f"{required_template_id!r} template, not {selected_template_id!r}."
                  )

          required_headings, required_checklist_items = trusted_templates[
              selected_template_id
          ]
          body_headings = set(heading_pattern.findall(visible_body))
          body_required_checklists = required_checklist_pattern.findall(visible_body)
          if len(body_required_checklists) != 1:
              raise SystemExit(
                  "Pull request body must contain exactly one required checklist section."
              )
          body_checklist_items = set(
              checklist_pattern.findall(body_required_checklists[0])
          )

          missing_headings = [heading for heading in required_headings if heading not in body_headings]
          missing_checklist_items = [
              item for item in required_checklist_items if item not in body_checklist_items
          ]
          if missing_headings or missing_checklist_items:
              if missing_headings:
                  print("Missing template headings: " + ", ".join(missing_headings))
              if missing_checklist_items:
                  print("Missing checklist items: " + ", ".join(missing_checklist_items))
              raise SystemExit(
                  "Pull request body must preserve every required heading and checklist "
                  f"item from the selected trusted template ({selected_template_id})."
              )
          if not is_draft:
              checked_checklist_items = set(
                  checked_checklist_pattern.findall(body_required_checklists[0])
              )
              unchecked_checklist_items = [
                  item
                  for item in required_checklist_items
                  if item not in checked_checklist_items
              ]
              if unchecked_checklist_items:
                  print(
                      "Required checklist items must be completed before ready for review: "
                      + ", ".join(unchecked_checklist_items)
                  )
                  raise SystemExit(
                      "Mark each required checklist item only after it is complete, "
                      "or keep the pull request as a draft."
                  )
          PY
