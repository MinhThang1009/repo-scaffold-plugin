name: Mutation testing

on:
  schedule:
    - cron: "41 5 1 * *"
  workflow_dispatch:
    inputs:
      clean:
        description: Ignore incremental mutation state and run every mutant
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-quality:
    name: mutation-quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Python support policy
        id: support
        shell: bash
        run: python scripts/python_support.py emit-github-output >> "$GITHUB_OUTPUT"

      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.support.outputs.latest }}
          cache: pip
          cache-dependency-path: requirements-mutation.lock

      - name: Install mutation-testing dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --requirement requirements-mutation.lock

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Restore mutation state
        id: mutation-cache
        if: ${{ !inputs.clean }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants/
          key: >-
            mutmut-v2-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.python.outputs.python-version }}-${{ github.sha }}
          restore-keys: |
            mutmut-v2-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.python.outputs.python-version }}-

      - name: Prepare incremental mutation state
        if: ${{ steps.mutation-cache.outputs.cache-hit != 'true' }}
        run: python scripts/prepare_mutation_cache.py prepare

      - name: Run mutation testing
        id: mutation-run
        if: ${{ steps.mutation-cache.outputs.cache-hit != 'true' }}
        env:
          REPO_SCAFFOLD_MUTATION_SOURCE_ROOT: ${{ github.workspace }}
        run: mutmut run --max-children 4

      - name: Record mutation cache inputs
        if: ${{ steps.mutation-cache.outputs.cache-hit != 'true' && steps.mutation-run.outcome == 'success' }}
        run: python scripts/prepare_mutation_cache.py record

      - name: Export mutation results
        if: ${{ always() }}
        run: |
          mutmut export-cicd-stats
          mutmut results --all true > mutants/mutation-results.txt
          python scripts/validate_mutation_results.py

      - name: Upload mutation results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/mutation-results.txt
            mutants/mutmut-stats.json
            mutants/mutation-cache-manifest.json
            mutants/**/*.meta
            mutants/**/*.py
          if-no-files-found: warn
          retention-days: 14
