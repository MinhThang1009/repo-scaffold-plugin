name: Release on version tag

# Manual-tag mode only. Do not install a release-please caller alongside this
# dispatcher because both callers could race to publish the same release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
