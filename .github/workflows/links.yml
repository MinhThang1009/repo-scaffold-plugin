name: Link health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Source assets contain intentionally unresolved relative scaffold markers.
      - name: Check rendered and authoring links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            './*.md'
            './skills/repo-scaffold/*.md'
            './skills/repo-scaffold/references/*.md'
          fail: true
          failIfEmpty: true
          token: ${{ secrets.GITHUB_TOKEN }}
