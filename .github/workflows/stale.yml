name: Close stale issues and PRs

# Mark issues/PRs stale after inactivity, then close them. Optional housekeeping.
on:
  schedule:
    - cron: '0 1 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "Inactive for 60 days; closing in 14 days without further activity."
          stale-pr-message: "Inactive for 60 days; closing in 14 days without further activity."
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
