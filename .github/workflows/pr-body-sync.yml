name: Update pull request body

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update:
    name: pr-body-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Use only trusted base-branch tooling. Never check out or execute PR code.
      - name: Check out trusted base tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Render and update the complete pull-request body
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            printf 'Invalid pull-request number.\n' >&2
            exit 1
          fi
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            printf 'Invalid repository binding.\n' >&2
            exit 1
          fi
          if [[ ! "$PR_HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            printf 'Invalid pull-request head repository.\n' >&2
            exit 1
          fi
          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf 'Invalid pull-request head SHA.\n' >&2
            exit 1
          fi
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf 'Invalid pull-request base SHA.\n' >&2
            exit 1
          fi

          payload="$RUNNER_TEMP/pr-body-pull-request.json"
          commits="$RUNNER_TEMP/pr-body-commits.json"
          files="$RUNNER_TEMP/pr-body-files.json"
          body="$RUNNER_TEMP/pr-body-current.md"
          updated="$RUNNER_TEMP/pr-body-updated.md"
          latest_payload="$RUNNER_TEMP/pr-body-latest.json"
          verified_payload="$RUNNER_TEMP/pr-body-verified.json"

          gh_api_to_file() {
            local output="$1"
            local byte_limit="$2"
            shift 2
            gh api --hostname github.com "$@" |
              python -c '
          import sys
          from pathlib import Path

          byte_limit = int(sys.argv[2])
          payload = sys.stdin.buffer.read(byte_limit + 1)
          if len(payload) > byte_limit:
              raise SystemExit("GitHub API response exceeds the byte safety cap.")
          Path(sys.argv[1]).write_bytes(payload)
          ' "$output" "$byte_limit"
          }

          gh_api_to_file "$payload" 2097152 "repos/$REPOSITORY/pulls/$PR_NUMBER"
          python - "$payload" "$body" "$PR_HEAD_SHA" "$PR_HEAD_REPOSITORY" "$PR_TITLE" "$PR_BASE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload_path = Path(sys.argv[1])
          body_path = Path(sys.argv[2])
          expected_head_sha = sys.argv[3]
          expected_repository = sys.argv[4]
          expected_title = sys.argv[5]
          expected_base_sha = sys.argv[6]
          raw = payload_path.read_bytes()
          if len(raw) > 2 * 1024 * 1024:
              raise SystemExit("Pull-request API payload exceeds the safety cap.")
          try:
              payload = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Pull-request API payload is invalid: {error}") from error
          head = payload.get("head") if isinstance(payload, dict) else None
          base = payload.get("base") if isinstance(payload, dict) else None
          actual_repository = (
              head.get("repo", {}).get("full_name")
              if isinstance(head, dict) and isinstance(head.get("repo"), dict)
              else None
          )
          if (
              not isinstance(head, dict)
              or not isinstance(base, dict)
              or head.get("sha") != expected_head_sha
              or actual_repository != expected_repository
              or base.get("sha") != expected_base_sha
              or payload.get("title") != expected_title
              or payload.get("state") != "open"
          ):
              raise SystemExit("Pull-request ref, title, or state advanced; retry the workflow.")
          for field, limit in (("commits", 250), ("changed_files", 3000)):
              value = payload.get(field)
              if (
                  not isinstance(value, int)
                  or isinstance(value, bool)
                  or value < 0
                  or value > limit
              ):
                  raise SystemExit(f"Pull-request {field} inventory is invalid or exceeds the API limit.")
          body = payload.get("body")
          if body is None:
              body = ""
          if not isinstance(body, str):
              raise SystemExit("Pull-request body is not text.")
          body_path.write_bytes(body.encode("utf-8"))
          PY

          collect_pages() {
            local endpoint="$1"
            local prefix="$2"
            local kind="$3"
            local max_pages="$4"
            local page_dir="$RUNNER_TEMP/${prefix}-pages"
            local page=1
            local count=0
            mkdir -p "$page_dir"
            while (( page <= max_pages )); do
              local page_path="$page_dir/$page.json"
              gh_api_to_file "$page_path" 10485760 \
                "$endpoint?per_page=100&page=$page"
              count=$(python - "$page_path" "$kind" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          kind = sys.argv[2]
          raw = path.read_bytes()
          if len(raw) > 10 * 1024 * 1024:
              raise SystemExit("Paginated API response exceeds the safety cap.")
          try:
              payload = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Paginated API response is invalid: {error}") from error
          if kind == "checks":
              items = payload.get("check_runs") if isinstance(payload, dict) else None
          else:
              items = payload
          if not isinstance(items, list):
              raise SystemExit("Paginated API response has an invalid item array.")
          print(len(items))
          PY
              )
              if (( count < 100 || page == max_pages )); then
                break
              fi
              page=$((page + 1))
            done
            if (( page > max_pages )); then
              printf 'Paginated API response exceeded the bounded page limit.\n' >&2
              exit 1
            fi
            python - "$page_dir" "$RUNNER_TEMP/pr-body-$prefix.json" 10485760 <<'PY'
          import json
          import sys
          from pathlib import Path

          directory = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          total_limit = int(sys.argv[3])
          paths = sorted(directory.glob("*.json"), key=lambda path: int(path.stem))
          encoded_pages = []
          total_bytes = 2
          for path in paths:
              with path.open("rb") as source:
                  raw = source.read(10485760 + 1)
              if len(raw) > 10485760:
                  raise SystemExit("Paginated API response exceeds the safety cap.")
              try:
                  page_payload = json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise SystemExit(f"Paginated API response is invalid: {error}") from error
              if not isinstance(page_payload, list):
                  raise SystemExit("Paginated API response has an invalid item array.")
              encoded = json.dumps(
                  page_payload, ensure_ascii=False, separators=(",", ":")
              ).encode("utf-8")
              total_bytes += len(encoded) + (1 if encoded_pages else 0)
              if total_bytes > total_limit:
                  raise SystemExit("Combined paginated API evidence exceeds the safety cap.")
              encoded_pages.append(encoded)
          output_path.write_bytes(b"[" + b",".join(encoded_pages) + b"]")
          PY
          }

          collect_pages "repos/$REPOSITORY/pulls/$PR_NUMBER/commits" commits commits 3
          collect_pages "repos/$REPOSITORY/pulls/$PR_NUMBER/files" files files 30

          python scripts/render_pr_body_evidence.py \
            --body-file "$body" \
            --pr-file "$payload" \
            --commits-file "$commits" \
            --files-file "$files" \
            --output "$updated"
          python scripts/markdown_body_preflight.py --body-file "$updated"
          python scripts/pr_template_preflight.py \
            --title "$PR_TITLE" \
            --body-file "$updated"
          if cmp -s "$body" "$updated"; then
            printf 'The complete pull-request body is already current.\n'
            exit 0
          fi

          gh_api_to_file "$latest_payload" 2097152 \
            "repos/$REPOSITORY/pulls/$PR_NUMBER"
          python - "$latest_payload" "$body" "$PR_HEAD_SHA" "$PR_HEAD_REPOSITORY" "$PR_TITLE" "$PR_BASE_SHA" "$payload" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload_path = Path(sys.argv[1])
          original_body_path = Path(sys.argv[2])
          expected_head_sha = sys.argv[3]
          expected_repository = sys.argv[4]
          expected_title = sys.argv[5]
          expected_base_sha = sys.argv[6]
          expected_payload_path = Path(sys.argv[7])
          raw = payload_path.read_bytes()
          if len(raw) > 2 * 1024 * 1024:
              raise SystemExit("Pull-request API payload exceeds the safety cap.")
          try:
              payload = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Pull-request API payload is invalid: {error}") from error
          expected_raw = expected_payload_path.read_bytes()
          try:
              expected_payload = json.loads(expected_raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Initial pull-request API payload is invalid: {error}") from error
          head = payload.get("head") if isinstance(payload, dict) else None
          base = payload.get("base") if isinstance(payload, dict) else None
          actual_repository = (
              head.get("repo", {}).get("full_name")
              if isinstance(head, dict) and isinstance(head.get("repo"), dict)
              else None
          )
          if (
              not isinstance(head, dict)
              or not isinstance(base, dict)
              or head.get("sha") != expected_head_sha
              or actual_repository != expected_repository
              or base.get("sha") != expected_base_sha
              or payload.get("title") != expected_title
              or payload.get("state") != "open"
          ):
              raise SystemExit("Pull-request ref, title, or state changed during body preparation.")
          for field in ("commits", "changed_files"):
              if payload.get(field) != expected_payload.get(field):
                  raise SystemExit("Pull-request inventory changed during body preparation; retry the workflow.")
          body = payload.get("body")
          if body is None:
              body = ""
          if not isinstance(body, str):
              raise SystemExit("Pull-request body is not text.")
          original = original_body_path.read_bytes().decode("utf-8")
          if body != original:
              raise SystemExit("Pull-request body changed during preparation; retry the workflow.")
          PY

          gh pr edit "$PR_NUMBER" \
            --repo "github.com/$REPOSITORY" \
            --body-file "$updated"

          gh_api_to_file "$verified_payload" 2097152 \
            "repos/$REPOSITORY/pulls/$PR_NUMBER"
          python - "$verified_payload" "$updated" "$PR_HEAD_SHA" "$PR_HEAD_REPOSITORY" "$PR_TITLE" "$PR_BASE_SHA" "$payload" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload_path = Path(sys.argv[1])
          expected_body_path = Path(sys.argv[2])
          expected_head_sha = sys.argv[3]
          expected_repository = sys.argv[4]
          expected_title = sys.argv[5]
          expected_base_sha = sys.argv[6]
          expected_payload_path = Path(sys.argv[7])
          raw = payload_path.read_bytes()
          if len(raw) > 2 * 1024 * 1024:
              raise SystemExit("Pull-request API payload exceeds the safety cap.")
          try:
              payload = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Pull-request API payload is invalid: {error}") from error
          expected_raw = expected_payload_path.read_bytes()
          try:
              expected_payload = json.loads(expected_raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Initial pull-request API payload is invalid: {error}") from error
          head = payload.get("head") if isinstance(payload, dict) else None
          base = payload.get("base") if isinstance(payload, dict) else None
          actual_repository = (
              head.get("repo", {}).get("full_name")
              if isinstance(head, dict) and isinstance(head.get("repo"), dict)
              else None
          )
          if (
              not isinstance(head, dict)
              or not isinstance(base, dict)
              or head.get("sha") != expected_head_sha
              or actual_repository != expected_repository
              or base.get("sha") != expected_base_sha
              or payload.get("title") != expected_title
              or payload.get("state") != "open"
          ):
              raise SystemExit("Pull-request ref, title, or state changed during the body update.")
          for field in ("commits", "changed_files"):
              if payload.get(field) != expected_payload.get(field):
                  raise SystemExit("Pull-request inventory changed during the body update; retry the workflow.")
          actual_body = payload.get("body")
          expected_body = expected_body_path.read_bytes().decode("utf-8")
          if actual_body != expected_body:
              raise SystemExit("GitHub did not retain the generated pull-request body.")
          PY
