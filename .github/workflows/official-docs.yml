name: Official documentation review

on:
  schedule:
    - cron: "29 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-scaffold-official-docs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    name: official-docs-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Review authoritative documentation claims
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/audit_official_docs.py \
            --repository-root . \
            --json-output "$RUNNER_TEMP/official-docs.json" \
            --markdown-output "$RUNNER_TEMP/official-docs.md"
          checker_exit=$?
          set -e
          if [[ ! -f "$RUNNER_TEMP/official-docs.md" ]]; then
            printf '%s\n' \
              '<!-- repo-scaffold-official-docs-audit -->' \
              '# Official documentation review report' \
              '' \
              'The checker failed before it could produce a report. Inspect this workflow run before changing a claim.' \
              > "$RUNNER_TEMP/official-docs.md"
            checker_exit=2
          fi
          printf 'checker_exit=%s\n' "$checker_exit" >> "$GITHUB_OUTPUT"

      - name: Add report to job summary
        shell: bash
        run: cat "$RUNNER_TEMP/official-docs.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHECKER_EXIT: ${{ steps.audit.outputs.checker_exit }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- repo-scaffold-official-docs-audit -->'
          title='Official documentation review required'
          issue_numbers_output=$(
            gh api --hostname github.com \
              "search/issues?q=repo:${REPOSITORY}+is:issue+is:open+in:body+%22%3C%21--+repo-scaffold-official-docs-audit+--%3E%22&per_page=2" \
              --jq 'if type == "object" and .incomplete_results == false and (.total_count | type) == "number" and .total_count >= 0 and .total_count == (.total_count | floor) and (.items | type) == "array" and (.items | length) == ([.total_count, 2] | min) and all(.items[]; type == "object" and (.number | type) == "number" and .number > 0 and .number == (.number | floor)) and ([.items[].number] | unique | length) == (.items | length) then if (.items | length) == 0 then "none" else [.items[].number] | join(" ") end else error("Incomplete or invalid issue search response") end'
          )
          if [[ -z "$issue_numbers_output" ]]; then
            printf 'Issue search returned no verified result.\n' >&2
            exit 1
          fi
          issue_numbers=()
          if [[ "$issue_numbers_output" != 'none' ]]; then
            read -r -a issue_numbers <<< "$issue_numbers_output"
          fi
          if (( ${#issue_numbers[@]} > 1 )); then
            printf 'Found multiple open official-documentation reminder issues.\n' >&2
            exit 1
          fi
          grep -Fq "$marker" "$RUNNER_TEMP/official-docs.md"
          if [[ "$CHECKER_EXIT" != '0' && "$CHECKER_EXIT" != '1' && "$CHECKER_EXIT" != '2' ]]; then
            printf 'Official-docs checker returned an unexpected exit status: %s\n' "$CHECKER_EXIT" >&2
            exit 1
          fi
          if [[ "$CHECKER_EXIT" == '2' ]]; then
            printf 'Official-docs checker was indeterminate; no reminder issue was changed.\n' >&2
            exit 1
          fi
          if [[ "$CHECKER_EXIT" == '0' ]]; then
            if (( ${#issue_numbers[@]} == 1 )); then
              gh issue close "${issue_numbers[0]}" \
                --repo "github.com/${REPOSITORY}" \
                --comment 'The scheduled official-documentation review is current, so this reminder is closing automatically.'
            fi
            exit 0
          fi
          python scripts/markdown_body_preflight.py --body-file "$RUNNER_TEMP/official-docs.md"
          if (( ${#issue_numbers[@]} == 1 )); then
            gh issue edit "${issue_numbers[0]}" \
              --repo "github.com/${REPOSITORY}" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/official-docs.md"
          else
            gh issue create \
              --repo "github.com/${REPOSITORY}" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/official-docs.md"
          fi
          if [[ "$CHECKER_EXIT" != '0' ]]; then
            exit 1
          fi
