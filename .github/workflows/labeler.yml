name: Labeler

# Auto-label PRs by the files they change, using the rules in .github/labeler.yml.
# Uses pull_request_target so labels apply to PRs from forks too. Safe here because
# actions/labeler reads its config from the base ref and never checks out PR code.
# Dependabot PRs are skipped because GitHub forces their pull_request_target token
# to read-only, so the action could not apply labels. Do NOT add an
# `actions/checkout` of the PR head to this workflow.
on: [pull_request_target]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
