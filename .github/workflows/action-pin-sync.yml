name: Synchronize versioned maintenance inputs

on:
  schedule:
    - cron: "11 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual dispatch can select a ref, but every run writes the same maintenance
  # branch. Serialize by repository so selected refs cannot race that PR.
  group: repo-scaffold-version-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  synchronize:
    name: synchronize-versioned-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual dispatch can select another branch or tag. Keep repository
          # code and the token-backed PR mutation on the trusted default branch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify version-sync token
        env:
          VERSION_SYNC_TOKEN: ${{ secrets.VERSION_SYNC_TOKEN }}
        run: |
          if [ -z "$VERSION_SYNC_TOKEN" ]; then
            echo "::error::VERSION_SYNC_TOKEN is required. Configure a repository-scoped fine-grained PAT with Contents, Pull requests, and Workflows write permissions."
            exit 1
          fi

      - name: Synchronize versioned maintenance inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_versioned_inputs.py --write

      - name: Validate version-maintenance pull request body
        run: python scripts/markdown_body_preflight.py --body-file .github/action-pin-sync-pr-body.md

      - name: Create version-maintenance pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.VERSION_SYNC_TOKEN }}
          branch: chore/synchronize-versioned-inputs
          delete-branch: true
          draft: true
          commit-message: "chore(ci): synchronize versioned inputs"
          title: "chore(ci): synchronize versioned inputs"
          body-path: .github/action-pin-sync-pr-body.md
