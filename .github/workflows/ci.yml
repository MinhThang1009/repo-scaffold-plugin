name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_ci:
    name: prepare-ci-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.support.outputs.matrix }}
      latest: ${{ steps.support.outputs.latest }}
      shellcheck_repository: ${{ steps.toolchain.outputs.shellcheck_repository }}
      shellcheck_tag: ${{ steps.toolchain.outputs.shellcheck_tag }}
      shellcheck_asset: ${{ steps.toolchain.outputs.shellcheck_asset }}
      shellcheck_archive_format: ${{ steps.toolchain.outputs.shellcheck_archive_format }}
      shellcheck_executable_path: ${{ steps.toolchain.outputs.shellcheck_executable_path }}
      shellcheck_sha256: ${{ steps.toolchain.outputs.shellcheck_sha256 }}
      actionlint_repository: ${{ steps.toolchain.outputs.actionlint_repository }}
      actionlint_tag: ${{ steps.toolchain.outputs.actionlint_tag }}
      actionlint_asset: ${{ steps.toolchain.outputs.actionlint_asset }}
      actionlint_archive_format: ${{ steps.toolchain.outputs.actionlint_archive_format }}
      actionlint_executable_path: ${{ steps.toolchain.outputs.actionlint_executable_path }}
      actionlint_sha256: ${{ steps.toolchain.outputs.actionlint_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Python support policy
        id: support
        shell: bash
        run: python scripts/python_support.py emit-github-output >> "$GITHUB_OUTPUT"

      - name: Load CI toolchain policy
        id: toolchain
        shell: bash
        run: python skills/repo-scaffold/scripts/ci_toolchain.py emit-github-output >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: prepare_ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_ci.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --requirement requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

  quality:
    name: quality
    needs: prepare_ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.prepare_ci.outputs.latest }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --requirement requirements-dev.txt

      - name: Validate official documentation tracker registry
        run: python scripts/audit_official_docs.py --repository-root . --validate-registry

      - name: Enforce test coverage baseline
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage report

      - name: Check formatting
        run: python -m ruff format --check skills scripts tests

      - name: Lint Python
        run: python -m ruff check skills scripts tests

      - name: Type check
        run: >-
          python -m mypy --explicit-package-bases
          skills/repo-scaffold/scripts/check_community_health.py
          skills/repo-scaffold/scripts/audit_freshness.py
          skills/repo-scaffold/scripts/codeql_preflight.py
          skills/repo-scaffold/scripts/ci_toolchain.py
          skills/repo-scaffold/scripts/sync_action_pins.py
          skills/repo-scaffold/scripts/validate_scaffold.py
          scripts/audit_freshness.py
          scripts/audit_official_docs.py
          scripts/check_code_scanning_alerts.py
          scripts/prepare_mutation_cache.py
          scripts/python_support.py
          scripts/run_mutation_testing.py
          scripts/sync_action_pins.py
          scripts/validate_mutation_results.py
          scripts/validate_repository.py
          scripts/validate_workflows.py
          tests

      - name: Compile Python
        run: python -m compileall -q skills/repo-scaffold/scripts scripts tests

      - name: Install ShellCheck
        env:
          SHELLCHECK_REPOSITORY: ${{ needs.prepare_ci.outputs.shellcheck_repository }}
          SHELLCHECK_TAG: ${{ needs.prepare_ci.outputs.shellcheck_tag }}
          SHELLCHECK_ASSET: ${{ needs.prepare_ci.outputs.shellcheck_asset }}
          SHELLCHECK_ARCHIVE_FORMAT: ${{ needs.prepare_ci.outputs.shellcheck_archive_format }}
          SHELLCHECK_EXECUTABLE_PATH: ${{ needs.prepare_ci.outputs.shellcheck_executable_path }}
          SHELLCHECK_SHA256: ${{ needs.prepare_ci.outputs.shellcheck_sha256 }}
        run: |
          set -euo pipefail
          archive="$SHELLCHECK_ASSET"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/${SHELLCHECK_REPOSITORY}/releases/download/${SHELLCHECK_TAG}/${archive}"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" |
            sha256sum --check --strict
          extract_dir="$RUNNER_TEMP/shellcheck-extract"
          mkdir "$extract_dir"
          case "$SHELLCHECK_ARCHIVE_FORMAT" in
            tar.gz) tar --extract --gzip --file "$archive" --directory "$extract_dir" "$SHELLCHECK_EXECUTABLE_PATH" ;;
            tar.xz) tar --extract --xz --file "$archive" --directory "$extract_dir" "$SHELLCHECK_EXECUTABLE_PATH" ;;
            *) printf 'Unsupported archive format: %s\n' "$SHELLCHECK_ARCHIVE_FORMAT" >&2; exit 1 ;;
          esac
          install -m 0755 "$extract_dir/$SHELLCHECK_EXECUTABLE_PATH" "$RUNNER_TEMP/shellcheck"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install actionlint
        env:
          ACTIONLINT_REPOSITORY: ${{ needs.prepare_ci.outputs.actionlint_repository }}
          ACTIONLINT_TAG: ${{ needs.prepare_ci.outputs.actionlint_tag }}
          ACTIONLINT_ASSET: ${{ needs.prepare_ci.outputs.actionlint_asset }}
          ACTIONLINT_ARCHIVE_FORMAT: ${{ needs.prepare_ci.outputs.actionlint_archive_format }}
          ACTIONLINT_EXECUTABLE_PATH: ${{ needs.prepare_ci.outputs.actionlint_executable_path }}
          ACTIONLINT_SHA256: ${{ needs.prepare_ci.outputs.actionlint_sha256 }}
        run: |
          set -euo pipefail
          archive="$ACTIONLINT_ASSET"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/${ACTIONLINT_REPOSITORY}/releases/download/${ACTIONLINT_TAG}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" |
            sha256sum --check --strict
          extract_dir="$RUNNER_TEMP/actionlint-extract"
          mkdir "$extract_dir"
          case "$ACTIONLINT_ARCHIVE_FORMAT" in
            tar.gz) tar --extract --gzip --file "$archive" --directory "$extract_dir" "$ACTIONLINT_EXECUTABLE_PATH" ;;
            tar.xz) tar --extract --xz --file "$archive" --directory "$extract_dir" "$ACTIONLINT_EXECUTABLE_PATH" ;;
            *) printf 'Unsupported archive format: %s\n' "$ACTIONLINT_ARCHIVE_FORMAT" >&2; exit 1 ;;
          esac
          install -m 0755 "$extract_dir/$ACTIONLINT_EXECUTABLE_PATH" "$RUNNER_TEMP/actionlint"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: python scripts/validate_workflows.py

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

  mutation-cache-integration:
    name: mutation-cache-integration
    needs: prepare_ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.prepare_ci.outputs.latest }}
          cache: pip
          cache-dependency-path: requirements-mutation.txt

      - name: Install mutation-testing dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --requirement requirements-mutation.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Exercise real fork-based incremental reuse
        env:
          REPO_SCAFFOLD_MUTMUT_INTEGRATION: "1"
        run: python -m pytest -q tests/test_mutation_runner_linux.py

  python-latest-canary:
    name: python-latest-canary
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up latest stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --requirement requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests on the latest stable Python
        run: python -m pytest -q

      - name: Detect undeclared stable Python releases
        run: python scripts/python_support.py verify-latest-runtime

  toolchain-drift-canary:
    name: toolchain-drift-canary
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect reviewed CI tool release drift
        run: python skills/repo-scaffold/scripts/ci_toolchain.py verify-latest-releases

  policy-drift-reminder:
    name: policy-drift-reminder
    needs: [python-latest-canary, toolchain-drift-canary]
    if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Reconcile policy-drift reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHON_CANARY_RESULT: ${{ needs.python-latest-canary.result }}
          TOOLCHAIN_CANARY_RESULT: ${{ needs.toolchain-drift-canary.result }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- repo-scaffold-ci-policy-drift -->'
          title='CI policy review required'
          mapfile -t issue_numbers < <(
            gh api --hostname github.com --paginate \
              "repos/${REPOSITORY}/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | select((.body // "") | contains("<!-- repo-scaffold-ci-policy-drift -->")) | .number'
          )
          if (( ${#issue_numbers[@]} > 1 )); then
            printf 'Found multiple open CI policy reminder issues.\n' >&2
            exit 1
          fi
          if [[ "$PYTHON_CANARY_RESULT" == 'success' && "$TOOLCHAIN_CANARY_RESULT" == 'success' ]]; then
            if (( ${#issue_numbers[@]} == 1 )); then
              gh issue close "${issue_numbers[0]}" \
                --repo "github.com/${REPOSITORY}" \
                --comment 'The scheduled CI policy canaries are current, so this reminder is closing automatically.'
            fi
            exit 0
          fi
          if [[ "$PYTHON_CANARY_RESULT" != 'failure' && "$TOOLCHAIN_CANARY_RESULT" != 'failure' ]]; then
            printf '%s\n' 'A CI policy canary did not complete, so no drift reminder was changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          report="$RUNNER_TEMP/ci-policy-drift.md"
          {
            printf '%s\n' "$marker" '# CI policy drift report' ''
            printf '%s\n' "- Workflow run: $RUN_URL" ''
            printf '%s\n' '| Canary | Result | Required action |' '| --- | --- | --- |'
            printf '%s\n' "| Latest stable Python | \`$PYTHON_CANARY_RESULT\` | Review compatibility, then update \`.github/python-support.json\` if appropriate. |"
            printf '%s\n' "| CI toolchain | \`$TOOLCHAIN_CANARY_RESULT\` | Review the release and artifact digest, then update \`.github/ci-toolchain.json\` if appropriate. |"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          if (( ${#issue_numbers[@]} == 1 )); then
            gh issue edit "${issue_numbers[0]}" \
              --repo "github.com/${REPOSITORY}" \
              --title "$title" \
              --body-file "$report"
          else
            gh issue create \
              --repo "github.com/${REPOSITORY}" \
              --title "$title" \
              --body-file "$report"
          fi

  ci-success:
    name: ci-success
    needs: [test, quality, mutation-cache-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs passed
        env:
          MUTATION_CACHE_INTEGRATION_RESULT: ${{ needs.mutation-cache-integration.result }}
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$QUALITY_RESULT" != "success" ] ||
            [ "$MUTATION_CACHE_INTEGRATION_RESULT" != "success" ]; then
            echo "test=$TEST_RESULT quality=$QUALITY_RESULT mutation-cache-integration=$MUTATION_CACHE_INTEGRATION_RESULT"
            exit 1
          fi
          echo "All required CI jobs passed."
