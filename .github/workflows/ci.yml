name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_ci:
    name: prepare-ci-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.support.outputs.matrix }}
      latest: ${{ steps.support.outputs.latest }}
      shellcheck_repository: ${{ steps.toolchain.outputs.shellcheck_repository }}
      shellcheck_tag: ${{ steps.toolchain.outputs.shellcheck_tag }}
      shellcheck_asset: ${{ steps.toolchain.outputs.shellcheck_asset }}
      shellcheck_archive_format: ${{ steps.toolchain.outputs.shellcheck_archive_format }}
      shellcheck_executable_path: ${{ steps.toolchain.outputs.shellcheck_executable_path }}
      shellcheck_sha256: ${{ steps.toolchain.outputs.shellcheck_sha256 }}
      actionlint_repository: ${{ steps.toolchain.outputs.actionlint_repository }}
      actionlint_tag: ${{ steps.toolchain.outputs.actionlint_tag }}
      actionlint_asset: ${{ steps.toolchain.outputs.actionlint_asset }}
      actionlint_archive_format: ${{ steps.toolchain.outputs.actionlint_archive_format }}
      actionlint_executable_path: ${{ steps.toolchain.outputs.actionlint_executable_path }}
      actionlint_sha256: ${{ steps.toolchain.outputs.actionlint_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Python support policy
        id: support
        shell: bash
        run: python scripts/python_support.py emit-github-output >> "$GITHUB_OUTPUT"

      - name: Load CI toolchain policy
        id: toolchain
        shell: bash
        run: python skills/repo-scaffold/scripts/ci_toolchain.py emit-github-output >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: prepare_ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_ci.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install development dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --requirement requirements-dev.lock

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

  quality:
    name: quality
    needs: prepare_ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.prepare_ci.outputs.latest }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install development dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --requirement requirements-dev.lock

      - name: Enforce test coverage baseline
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage report

      - name: Check formatting
        run: python -m ruff format --check skills scripts tests

      - name: Lint Python
        run: python -m ruff check skills scripts tests

      - name: Type check
        run: >-
          python -m mypy
          skills/repo-scaffold/scripts/codeql_preflight.py
          skills/repo-scaffold/scripts/ci_toolchain.py
          skills/repo-scaffold/scripts/validate_scaffold.py
          scripts/python_support.py
          scripts/validate_repository.py
          scripts/validate_workflows.py
          tests

      - name: Compile Python
        run: python -m compileall -q skills/repo-scaffold/scripts scripts tests

      - name: Install ShellCheck
        env:
          SHELLCHECK_REPOSITORY: ${{ needs.prepare_ci.outputs.shellcheck_repository }}
          SHELLCHECK_TAG: ${{ needs.prepare_ci.outputs.shellcheck_tag }}
          SHELLCHECK_ASSET: ${{ needs.prepare_ci.outputs.shellcheck_asset }}
          SHELLCHECK_ARCHIVE_FORMAT: ${{ needs.prepare_ci.outputs.shellcheck_archive_format }}
          SHELLCHECK_EXECUTABLE_PATH: ${{ needs.prepare_ci.outputs.shellcheck_executable_path }}
          SHELLCHECK_SHA256: ${{ needs.prepare_ci.outputs.shellcheck_sha256 }}
        run: |
          set -euo pipefail
          archive="$SHELLCHECK_ASSET"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/${SHELLCHECK_REPOSITORY}/releases/download/${SHELLCHECK_TAG}/${archive}"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" |
            sha256sum --check --strict
          extract_dir="$RUNNER_TEMP/shellcheck-extract"
          mkdir "$extract_dir"
          case "$SHELLCHECK_ARCHIVE_FORMAT" in
            tar.gz) tar --extract --gzip --file "$archive" --directory "$extract_dir" "$SHELLCHECK_EXECUTABLE_PATH" ;;
            tar.xz) tar --extract --xz --file "$archive" --directory "$extract_dir" "$SHELLCHECK_EXECUTABLE_PATH" ;;
            *) printf 'Unsupported archive format: %s\n' "$SHELLCHECK_ARCHIVE_FORMAT" >&2; exit 1 ;;
          esac
          install -m 0755 "$extract_dir/$SHELLCHECK_EXECUTABLE_PATH" "$RUNNER_TEMP/shellcheck"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install actionlint
        env:
          ACTIONLINT_REPOSITORY: ${{ needs.prepare_ci.outputs.actionlint_repository }}
          ACTIONLINT_TAG: ${{ needs.prepare_ci.outputs.actionlint_tag }}
          ACTIONLINT_ASSET: ${{ needs.prepare_ci.outputs.actionlint_asset }}
          ACTIONLINT_ARCHIVE_FORMAT: ${{ needs.prepare_ci.outputs.actionlint_archive_format }}
          ACTIONLINT_EXECUTABLE_PATH: ${{ needs.prepare_ci.outputs.actionlint_executable_path }}
          ACTIONLINT_SHA256: ${{ needs.prepare_ci.outputs.actionlint_sha256 }}
        run: |
          set -euo pipefail
          archive="$ACTIONLINT_ASSET"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/${ACTIONLINT_REPOSITORY}/releases/download/${ACTIONLINT_TAG}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" |
            sha256sum --check --strict
          extract_dir="$RUNNER_TEMP/actionlint-extract"
          mkdir "$extract_dir"
          case "$ACTIONLINT_ARCHIVE_FORMAT" in
            tar.gz) tar --extract --gzip --file "$archive" --directory "$extract_dir" "$ACTIONLINT_EXECUTABLE_PATH" ;;
            tar.xz) tar --extract --xz --file "$archive" --directory "$extract_dir" "$ACTIONLINT_EXECUTABLE_PATH" ;;
            *) printf 'Unsupported archive format: %s\n' "$ACTIONLINT_ARCHIVE_FORMAT" >&2; exit 1 ;;
          esac
          install -m 0755 "$extract_dir/$ACTIONLINT_EXECUTABLE_PATH" "$RUNNER_TEMP/actionlint"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: python scripts/validate_workflows.py

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

  python-latest-canary:
    name: python-latest-canary
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up latest stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install development dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --requirement requirements-dev.lock

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests on the latest stable Python
        run: python -m pytest -q

      - name: Detect undeclared stable Python releases
        run: python scripts/python_support.py verify-latest-runtime

  toolchain-drift-canary:
    name: toolchain-drift-canary
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect reviewed CI tool release drift
        run: python skills/repo-scaffold/scripts/ci_toolchain.py verify-latest-releases

  ci-success:
    name: ci-success
    needs: [test, quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$QUALITY_RESULT" != "success" ]; then
            echo "test=$TEST_RESULT quality=$QUALITY_RESULT"
            exit 1
          fi
          echo "All required CI jobs passed."
