version: 2
updates:
  - package-ecosystem: "pip"
    # Keep root locks and mirrored scaffold documentation pins synchronized.
    directories:
      - "/"
      - "/skills/repo-scaffold/assets"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    groups:
      synchronized-python:
        group-by: "dependency-name"
      synchronized-python-security:
        applies-to: "security-updates"
        patterns:
          - "markdown-it-py"
          - "PyYAML"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    # Keep installed workflows and scaffold templates on the same immutable SHAs.
    directories:
      - "/"
      - "/skills/repo-scaffold/assets/workflows"
    schedule:
      interval: "weekly"
    groups:
      synchronized-actions:
        # One PR keeps sub-actions such as CodeQL init/analyze/upload-sarif on
        # the same release SHA across installed workflows and templates.
        applies-to: "version-updates"
        patterns:
          - "*"
      synchronized-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
