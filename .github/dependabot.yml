version: 2
updates:
  - package-ecosystem: "pip"
    # Keep root locks and mirrored scaffold documentation pins synchronized.
    directories:
      - "/"
      - "/skills/repo-scaffold/assets"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    groups:
      synchronized-python:
        group-by: "dependency-name"
      synchronized-python-security:
        applies-to: "security-updates"
        patterns:
          - "markdown-it-py"
          - "PyYAML"
    commit-message:
      prefix: "chore(deps)"
