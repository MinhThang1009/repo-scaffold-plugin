name: CI

# Generic CI skeleton. It fails closed until the placeholder steps are replaced with the
# project's real toolchain, install, lint, and test commands. Keep the ci-success aggregate job: branch
# protection should always require `ci-success` (it passes only if every matrix job did),
# plus any independent dependency-review or commitlint gates that are installed.
on:
  push:
    branches: ["{{REPO_SCAFFOLD_DEFAULT_BRANCH_GLOB_JSON_ESCAPED}}"]
  # `edited` reruns CI when the PR base branch changes, producing a check for the
  # new merge result. It also harmlessly reruns for title/body edits.
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # Required checks must also run against the synthetic merge-group commit.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Cancel superseded runs on the same ref (saves CI minutes); the latest push wins.
concurrency:
  # Concurrency groups are repository-wide; include the workflow name so an
  # unrelated workflow using the same ref cannot cancel this CI run.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Versions the project supports — latest LTS first, optionally `latest` too.
        version: ['lts/*']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Replace with the stack's setup (keep the full SHA pin) + enable cache:
      #   - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      #     with: { node-version: ${{ matrix.version }}, cache: npm }
      #   - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      #     with: { python-version: ${{ matrix.version }}, cache: pip }

      - name: Install dependencies
        run: |
          echo "::error::REPO_SCAFFOLD_CI_NOT_CONFIGURED: replace this step with the project's dependency installation command"
          exit 1
      - name: Lint
        run: |
          echo "::error::REPO_SCAFFOLD_CI_NOT_CONFIGURED: replace this step with the project's lint command"
          exit 1
      - name: Test
        run: |
          echo "::error::REPO_SCAFFOLD_CI_NOT_CONFIGURED: replace this step with the project's test command"
          exit 1

  # Aggregate test gate: require this instead of each matrix combo. It is green only
  # when every `test` matrix job succeeded. Require other independent gates separately.
  ci-success:
    name: ci-success
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all matrix jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "A matrix job failed: ${{ needs.test.result }}"; exit 1
          fi
          echo "All matrix jobs passed."
