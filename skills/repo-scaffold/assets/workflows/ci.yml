name: CI

# Generic CI skeleton. It fails closed until the placeholder steps are replaced with the
# project's real toolchain, install, lint, and test commands. Keep the ci-success aggregate job: branch
# protection should always require `ci-success` (it passes only if every matrix job did),
# plus any independent dependency-review or commitlint gates that are installed.
on:
  push:
    branches: ["{{REPO_SCAFFOLD_DEFAULT_BRANCH_GLOB_JSON_ESCAPED}}"]
  # `edited` reruns CI when the PR base branch changes, producing a check for the
  # new merge result. It also harmlessly reruns for title/body edits.
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # Required checks must also run against the synthetic merge-group commit.
  merge_group:
    types: [checks_requested]
  # The rendered workflow uses this non-required run to detect a newly released
  # stable runtime before the reviewed support policy is updated.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Serialize duplicate runs on the same ref. Required checks must finish instead
# of leaving a cancelled check on a head that is later reused by automation.
concurrency:
  # Concurrency groups are repository-wide; include the workflow name so an
  # unrelated workflow using the same ref cannot cancel this CI run.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.runtime.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Replace this fail-closed step with a parser for the project's reviewed
      # runtime-support policy file. Emit one compact matrix output line to
      # GITHUB_OUTPUT; do not duplicate supported versions in this workflow.
      - name: Load runtime support policy
        id: runtime
        run: |
          echo "::error::REPO_SCAFFOLD_CI_NOT_CONFIGURED: load the reviewed runtime support policy"
          exit 1

  test:
    needs: prepare_runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_runtime.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Replace with the stack's setup (keep the full SHA pin) + enable cache:
      #   - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      #     with: { node-version: ${{ matrix.version }}, cache: npm }
      #   - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      #     with: { python-version: ${{ matrix.version }}, cache: pip }

      - name: Install dependencies
        run: |
          echo "::error::REPO_SCAFFOLD_CI_NOT_CONFIGURED: replace this step with the project's dependency installation command"
          exit 1
      - name: Lint
        run: |
          echo "::error::REPO_SCAFFOLD_CI_NOT_CONFIGURED: replace this step with the project's lint command"
          exit 1
      - name: Test
        run: |
          echo "::error::REPO_SCAFFOLD_CI_NOT_CONFIGURED: replace this step with the project's test command"
          exit 1

  latest-runtime-canary:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Replace this entire fail-closed step with latest-stable runtime setup,
      # dependency installation, tests, and an undeclared-version drift check.
      - name: Test the latest stable runtime
        run: |
          echo "::error::REPO_SCAFFOLD_CI_NOT_CONFIGURED: configure the latest stable runtime canary"
          exit 1

  # Aggregate test gate: require this instead of each matrix combo. It is green only
  # when every `test` matrix job succeeded. Require other independent gates separately.
  ci-success:
    name: ci-success
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all matrix jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "A matrix job failed: $TEST_RESULT"
            exit 1
          fi
          echo "All matrix jobs passed."
