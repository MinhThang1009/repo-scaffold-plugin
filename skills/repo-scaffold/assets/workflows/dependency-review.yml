name: Dependency Review

# Scan dependency changes in pull requests for known vulnerabilities. Available for
# public repositories and eligible organization-owned private or internal repositories only.
on:
  # `edited` reruns the comparison when the PR base branch changes.
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # v5 reads base_sha/head_sha from the merge_group payload and reviews the
  # combined dependency delta that the queue is about to merge.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
