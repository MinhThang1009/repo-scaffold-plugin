name: Auto-merge (label-gated)

# Opt-in auto-merge for human PRs: add the 'automerge' label and mark the PR ready.
# Each run reconciles the current label, draft, head, and auto-merge state. New events
# cancel stale runs for the same PR, and enablement is bound to the observed head SHA.
# Removing the label or converting the PR to draft triggers best-effort cancellation of
# pending auto-merge. GitHub has no atomic label-conditioned enable mutation, so this
# cannot undo a merge that is already eligible or in progress. This complements
# dependabot-auto-merge.yml, which only covers Dependabot PRs.
#
# Token: prefer a PAT (RELEASE_PLEASE_TOKEN) so the auto-merge commit still triggers
# downstream workflows (e.g. release-please) -- a push made with the default GITHUB_TOKEN
# does NOT trigger other workflows. Falls back to GITHUB_TOKEN when no PAT is set (fine
# for repos without release-please).
#
# Requires: branch protection ("Require status checks to pass") and
# the repo's "Allow auto-merge" setting (gh repo edit --enable-auto-merge).
# This shipped asset is not a merge-queue workflow. The skill skips it when an
# effective merge_queue rule applies.
# Security boundary: pull_request_target loads this workflow from the trusted base
# branch before it can read RELEASE_PLEASE_TOKEN. Every job is restricted to a human
# same-repository PR. Never checkout, fetch, download, or execute PR-controlled content.
on:
  pull_request_target:
    types: [labeled, unlabeled, opened, reopened, ready_for_review, converted_to_draft, synchronize, auto_merge_enabled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Concurrency groups are repository-wide; namespace this group by workflow.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile-auto-merge:
    if: ${{ github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile pending auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          pr_state="$(
            gh pr view "$PR_URL" \
              --json labels,isDraft,autoMergeRequest,headRefOid \
              --jq '[([.labels[].name] | any(. == "automerge")), .isDraft, (.autoMergeRequest != null), .headRefOid] | @tsv'
          )"
          read -r has_label is_draft has_auto_merge head_oid <<<"$pr_state"
          if [[ ! "$head_oid" =~ ^[0-9a-fA-F]+$ ]] ||
            { [[ "${#head_oid}" -ne 40 ]] &&
              [[ "${#head_oid}" -ne 64 ]]; }; then
            echo "::error::Could not read a full SHA-1 or SHA-256 pull request head object ID."
            exit 1
          fi

          if [[ "$has_label" == "true" ]] &&
            [[ "$is_draft" == "false" ]]; then
            if [[ "$has_auto_merge" != "true" ]]; then
              gh pr merge --auto --squash --match-head-commit "$head_oid" "$PR_URL"
              # Re-check after the mutation as well. This closes the stale-snapshot
              # window when the PR is still open; an already completed merge cannot
              # be undone and is covered by the documented best-effort boundary.
              post_state="$(
                gh pr view "$PR_URL" \
                  --json labels,isDraft,autoMergeRequest,state \
                  --jq '[([.labels[].name] | any(. == "automerge")), .isDraft, (.autoMergeRequest != null), .state] | @tsv'
              )"
              read -r post_has_label post_is_draft post_has_auto_merge pr_state_name <<<"$post_state"
              if [[ "$pr_state_name" == "OPEN" ]] &&
                [[ "$post_has_auto_merge" == "true" ]] &&
                { [[ "$post_has_label" != "true" ]] ||
                  [[ "$post_is_draft" == "true" ]]; }; then
                gh pr merge --disable-auto "$PR_URL"
              fi
            fi
          elif [[ "$has_auto_merge" == "true" ]]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
