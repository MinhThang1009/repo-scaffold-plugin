name: Commitlint

# Validate Conventional Commit headers without delegating execution to a third-party
# action or mutable container image. The repository setup uses the validated PR title
# for squash commits, so release-please sees a valid default-branch message.
on:
  # `edited` is required because the validated PR title can change without a push.
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate Conventional Commit headers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');

          const allowedTypes = new Set([
            'build', 'chore', 'ci', 'docs', 'feat', 'fix', 'perf',
            'refactor', 'revert', 'style', 'test',
          ]);
          const commitPattern = /^([a-z]+)(?:\(([^()\r\n]+)\))?(!)?: (.+)$/u;

          function fail(message) {
            console.error(message);
            process.exitCode = 1;
          }

          function headerErrors(header, source) {
            const errors = [];
            if (header !== header.trim()) {
              errors.push(`${source}: header must not have leading or trailing whitespace`);
              return errors;
            }
            if ([...header].length > 100) {
              errors.push(`${source}: header must be at most 100 characters`);
            }
            const match = commitPattern.exec(header);
            if (!match) {
              errors.push(`${source}: use type(scope)!: subject, for example feat(parser): add TOML support`);
              return errors;
            }
            const [, type, scope, , subject] = match;
            if (!allowedTypes.has(type)) {
              errors.push(`${source}: unsupported type "${type}"`);
            }
            if (scope && scope !== scope.toLocaleLowerCase()) {
              errors.push(`${source}: scope must be lowercase`);
            }
            if (subject.endsWith('.')) {
              errors.push(`${source}: subject must not end with a period`);
            }
            const first = [...subject][0] ?? '';
            if (/^[\p{Ll}\p{Lu}\p{Lt}]$/u.test(first) && first !== first.toLocaleLowerCase()) {
              errors.push(`${source}: subject must start with a lowercase letter`);
            }
            return errors;
          }

          function validateHeader(header, source) {
            for (const error of headerErrors(header, source)) fail(error);
          }

          const base = process.env.BASE_SHA ?? '';
          const head = process.env.HEAD_SHA ?? '';
          for (const [name, value] of [['BASE_SHA', base], ['HEAD_SHA', head]]) {
            if (!/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/iu.test(value)) {
              console.error(`${name} is not a full SHA-1 or SHA-256 Git object ID`);
              process.exit(1);
            }
          }

          const revListArgs = ['rev-list', '--reverse'];
          // A merge-group head is a synthetic merge commit generated by GitHub. Its
          // message is not contributor-controlled, so validate the queued leaf commits
          // while excluding synthetic and user-created merge commits from this event.
          if (process.env.EVENT_NAME === 'merge_group') revListArgs.push('--no-merges');
          revListArgs.push(`${base}..${head}`);
          const result = spawnSync('git', revListArgs, {
            encoding: 'utf8',
          });
          if (result.status !== 0) {
            console.error(result.stderr || 'Could not enumerate commits to validate');
            process.exit(1);
          }
          const commits = result.stdout.trim().split(/\r?\n/u).filter(Boolean);
          if (commits.length === 0) {
            console.error('No commits were found in the event range');
            process.exit(1);
          }
          for (const sha of commits) {
            const subjectResult = spawnSync('git', ['show', '-s', '--format=%s', sha], {
              encoding: 'utf8',
            });
            if (subjectResult.status !== 0) {
              console.error(subjectResult.stderr || `Could not read commit ${sha}`);
              process.exit(1);
            }
            const subject = subjectResult.stdout.replace(/\r?\n$/u, '');
            let errors = headerErrors(subject, `commit ${sha}`);
            // A squash merge queue may append " (#123)" to an otherwise valid PR
            // title. Prefer the raw commit message; use the suffix-stripped form only
            // as a fallback when the raw form fails, so contributor-authored subjects
            // such as "feat: x. (#123)" retain their intended punctuation semantics.
            if (errors.length > 0 && process.env.EVENT_NAME === 'merge_group') {
              const normalized = subject.replace(/ \(#[0-9]+\)$/u, '');
              if (normalized !== subject) errors = headerErrors(normalized, `commit ${sha}`);
            }
            for (const error of errors) fail(error);
          }

          if (process.env.EVENT_NAME === 'pull_request') {
            validateHeader(process.env.PR_TITLE ?? '', 'pull request title');
          }
          if (process.exitCode) process.exit(process.exitCode);
          console.log(`Validated ${commits.length} commit header(s).`);
          NODE
