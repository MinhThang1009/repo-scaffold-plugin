name: Dependabot auto-merge

# Auto-merge Dependabot PRs for compatible (patch + minor) updates once CI passes.
# This workflow never enables or disables auto-merge for major updates. Preserving an
# existing request avoids racing a maintainer who changes that state concurrently.
#
# Requires: branch protection with "Require status checks to pass" (so --auto waits for
# CI) and the repo's "Allow auto-merge" setting (gh repo edit --enable-auto-merge).
# Do not install this asset when an effective merge queue rule applies: the built-in
# GITHUB_TOKEN cannot add a pull request to the queue.
#
# Uses pull_request because GitHub forces Dependabot-triggered pull_request_target
# workflows to a read-only token. The explicit permissions below can grant the
# Dependabot pull_request workflow the write access needed for auto-merge. Safe use:
# this workflow never checks out or runs PR code and only acts on same-repository PRs
# authored by dependabot[bot].
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile Dependabot auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT_HEAD_OID: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EVENT_HEAD_OID}" =~ ^[0-9a-fA-F]+$ ]] ||
            { [[ "${#EVENT_HEAD_OID}" -ne 40 ]] &&
              [[ "${#EVENT_HEAD_OID}" -ne 64 ]]; }; then
            echo "::error::Dependabot event head must be a full SHA-1 or SHA-256 Git object ID."
            exit 1
          fi

          pr_state="$(
            gh pr view "${PR_URL}" --json headRefOid,autoMergeRequest,state \
              --jq '[.headRefOid, (.autoMergeRequest != null), .state] | @tsv'
          )"
          read -r current_head has_auto_merge state <<<"${pr_state}"
          if [[ "${state}" != "OPEN" ]]; then
            echo "Pull request is ${state}; no auto-merge reconciliation is needed."
            exit 0
          fi
          if [[ "${current_head,,}" != "${EVENT_HEAD_OID,,}" ]]; then
            echo "A newer pull request head exists; skip this stale workflow run."
            exit 0
          fi

          case "${UPDATE_TYPE}" in
            version-update:semver-patch|version-update:semver-minor)
              if [[ "${has_auto_merge}" != "true" ]]; then
                gh pr merge --auto --squash \
                  --match-head-commit "${EVENT_HEAD_OID}" "${PR_URL}"
              fi
              ;;
            version-update:semver-major)
              echo "Major updates are not auto-enabled; preserve the current auto-merge state."
              ;;
            *)
              echo "Update type '${UPDATE_TYPE}' is not eligible for automatic merge."
              ;;
          esac

          post_state="$(
            gh pr view "${PR_URL}" --json headRefOid,autoMergeRequest,state \
              --jq '[.headRefOid, (.autoMergeRequest != null), .state] | @tsv'
          )"
          read -r post_head post_has_auto_merge post_pr_state <<<"${post_state}"
          if [[ "${post_pr_state}" == "OPEN" ]] &&
            [[ "${post_head,,}" == "${EVENT_HEAD_OID,,}" ]]; then
            case "${UPDATE_TYPE}" in
              version-update:semver-patch|version-update:semver-minor)
                if [[ "${post_has_auto_merge}" != "true" ]]; then
                  echo "::error::Auto-merge was not enabled for the verified Dependabot head."
                  exit 1
                fi
                ;;
            esac
          fi
